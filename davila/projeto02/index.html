<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>
    <h1>Formulário</h1>
    <form>
        <fieldset>
            <legend>Dados pessoais</legend>
            <label>Nome:</label>
            <input type="text" size="100">
            <br>
            <br>
            <label>Data de Nascimento:</label>
            <input type="date" size="100">
            <br>
            <br>
            <label>Endereço:</label>
            <input type="text" size="100">
            <br>
            <br>
            <label>Bairro:</label>
            <input type="text" size="30">
            <label>Cidade</label>
            <input type="text" size="30">
            <br>
            <br>
            <label>CEP:</label>
            <input type="text">
            <label>Estado:</label>
            <select>
                <option value="CE">Ceará</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="SP">São Paulo</option>
            </select>
            <br>
            <br>
            <label>Cor favorita:</label>
            <input type="color">
            <br>
            <br>
            <label>Nivel de satisfação:</label>
            <input type="range">
        </fieldset>

        <br>
        <fieldset>
            <legend>Dados profissionais</legend>
            <label>Natureza do Cargo</label>
            <br>
            <input type="radio" >Gerencia
            <input type="radio" >Financeiro
            <input type="radio">Recepção
            <input type="radio">Administração
            <input type="radio">Juridico
            <br>
            <br>
            <label>Área de interrece</label>
            <br>
            <input type="checkbox">Computação
            <input type="checkbox">Quimica
            <input type="checkbox">Meio Ambiente
            <input type="checkbox">Engenharia
            <input type="checkbox">Matematica
            <br>
            <br>

            <label>Mini-curriculo</label>
            <br>
            <textarea></textarea>
        </fieldset>
        <br>
        <input type="submit" value="Enviar">
        <input type="submit" value="Limpar">
    </form>
</body>

</html>
